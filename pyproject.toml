[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pronaos"
version = "0.1.0"
description = "Enterprise LLM gateway with observability, cost control, multi-tenancy, and agent-native tracing."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Guna Pavan" }]
keywords = ["llm", "gateway", "observability", "enterprise", "ai-infra"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "typer>=0.13",
    "redis>=5.2",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-redis>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28",
    "prometheus-client>=0.21",
    # Phase 7.2 — semantic cache. ``qdrant-client`` is small; ``sentence-
    # transformers`` pulls in PyTorch (~250 MB CPU wheels) but is the
    # standard local-embedding choice and worth carrying for a self-
    # hosted gateway. Import is lazy inside ``SentenceTransformerEmbedder``
    # so module load stays fast for callers that never touch semantic.
    "qdrant-client>=1.12",
    "sentence-transformers>=3.0",
    # Phase 9 — eval harness. PyYAML for human-editable golden-set
    # fixtures; it's already a transitive dep through several other
    # packages but pinning it here makes the dependency explicit.
    "pyyaml>=6.0",
    # Phase 39 — structured output validation. ``jsonschema`` is the
    # de-facto standard validator for JSON Schema drafts 4 through 2020-12;
    # we use it to validate LLM responses against client-supplied schemas
    # and to format error messages for the corrective retry prompt.
    "jsonschema>=4.23",
    # Phase 42 — AWS Bedrock native adapter. ``botocore`` is AWS's own
    # low-level SDK; we use ``botocore.auth.SigV4Auth`` for request
    # signing (the same code path boto3 uses, so signatures are
    # byte-identical to what the AWS CLI / boto3 SDK produce). We do
    # NOT use boto3's high-level clients — we issue the HTTP via
    # httpx so the gateway's existing async + circuit-breaker +
    # observability stack still wraps every call.
    "botocore>=1.35",
    # Phase 48 — native MCP (Model Context Protocol) server adapter.
    # Exposes Pronaos as an MCP server over SSE so MCP-speaking clients
    # (Claude Code, IDE tools, Anthropic's own apps) target the gateway
    # directly with all of Pronaos's auth/quota/audit/routing applied
    # automatically. Uses the official Anthropic-maintained Python SDK.
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "respx>=0.22",
    "fakeredis[lua]>=2.26",
    "pre-commit>=4.0",
    "types-redis",
    "types-jsonschema",
]

[project.scripts]
pronaos = "pronaos.main:cli"
pronaos-cli = "pronaos.cli:main"
# Phase 50 — MCP stdio bridge. Claude Code / Anthropic Desktop /
# Cursor / Windsurf / etc. all spawn MCP servers as local
# subprocesses; this entry point IS that subprocess. After ``pip
# install pronaos`` operators run e.g.::
#
#     claude mcp add pronaos -- pronaos-mcp-proxy \
#         --gateway-url http://127.0.0.1:8080 \
#         --api-key-file ~/.config/pronaos/api-key
pronaos-mcp-proxy = "pronaos.mcp:_stdio_main"

[tool.hatch.build.targets.wheel]
packages = ["src/pronaos"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle + pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "C4",            # comprehensions
    "ASYNC",
    "S",             # bandit-lite
    "RUF",
]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.per-file-ignores]
# Tests: assert is fine; long lines tolerated for SSE / fixture strings.
# C408/F841/RUF059/SIM117/RUF003 are stylistic patterns common in test
# code (kwargs-via-dict for readability, intentional named locals for
# self-documenting setup, nested context managers, em-dash/× in comments).
"tests/**" = ["S", "B", "E501", "C408", "F841", "RUF003", "RUF059", "SIM117"]
# Scripts are demos / experiments, not production code. Allow the
# pragmatic patterns (subprocess with partial path, fail-open try/except,
# blocking pathlib in async, long log lines) without polluting source-tree
# linting. Keep ``B`` and the obvious bug-bears so demos still get those.
"scripts/**" = ["S", "ASYNC", "SIM105", "E501", "C408", "UP042", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# PyYAML has no first-party type stubs and we don't want to pull
# ``types-PyYAML`` into the runtime deps for one import in the eval
# loader. The loader's own annotations are explicit enough.
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

# botocore ships without a py.typed marker. AWS hasn't shipped first-party
# stubs for the low-level SDK (only boto3-stubs covers the high-level
# clients, which we don't use). The adapter calls only the three
# documented public classes (SigV4Auth, AWSRequest, Credentials) — its
# own annotations cover the public surface.
[[tool.mypy.overrides]]
module = ["botocore.*"]
ignore_missing_imports = true

# Phase 48 — the official MCP Python SDK ships ``py.typed`` but its
# decorators (``Server.list_tools()``, ``Server.call_tool()``) erase
# the wrapped function's type signature. The adapter wraps those
# decorated handlers in its own typed surface (PronaosMcpServer
# + _forward) so the public side stays strict; line-level
# ``# type: ignore[no-untyped-call,untyped-decorator]`` comments in
# server.py keep the SDK-edge noise out of strict mypy without
# weakening Pronaos's own type coverage. The module override below
# is for the rare cases the SDK's own ``py.typed`` slips a Pyrsia-like
# unparametrized generic into a public call.
[[tool.mypy.overrides]]
module = ["mcp.server", "mcp.server.sse"]
disallow_untyped_decorators = false
disallow_untyped_calls = false

# Presidio is an OPTIONAL runtime dependency. ``guardrails/presidio.py``
# imports ``presidio_analyzer`` inside a try/except ImportError, gates
# the AnalyzerEngine behind a sentinel, and degrades gracefully when
# the dep is absent (see ``PresidioPIIDetector._get_analyzer``). Adding
# the (heavy) dep to pyproject.toml would make every install pull in
# spaCy + en_core_web_lg; we'd rather keep the option to skip. mypy
# doesn't need to find its stubs for the rest of the source tree to
# typecheck strictly.
[[tool.mypy.overrides]]
module = ["presidio_analyzer"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires external services (postgres, redis, qdrant)",
    "load: load/stress tests",
    "chaos: chaos engineering tests",
]

[tool.coverage.run]
branch = true
source = ["src/pronaos"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.bandit]
# Security static-analysis config. CI runs `bandit -c pyproject.toml -r src -ll`
# (medium+ severity only). Tests are excluded because they intentionally use
# insecure-looking patterns (hardcoded test keys, asserts, etc.).
exclude_dirs = ["tests", "migrations", ".venv"]
skips = [
    "B104",  # hardcoded_bind_all_interfaces — server intentionally binds 0.0.0.0
]
