# Local development stack for Pronaos.
# Brings up the minimum observability + data plane to build against.
# Production deployment is via Helm — see deploy/helm/.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pronaos
      POSTGRES_PASSWORD: pronaos
      POSTGRES_DB: pronaos
    ports: ["5432:5432"]
    volumes:
      - pronaos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pronaos"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - pronaos-redis:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - pronaos-qdrant:/qdrant/storage

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on: [tempo, prometheus]

  # Pinned to 2.6 — the newer ``latest`` tag changed its config schema
  # (drops ingester/compactor at the top level) and would silently break
  # this compose for anyone running it fresh.
  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo/config.yaml:/etc/tempo.yaml:ro
    ports: ["3200:3200"]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports: ["3000:3000"]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - pronaos-grafana:/var/lib/grafana
    depends_on: [tempo, prometheus]

volumes:
  pronaos-postgres:
  pronaos-redis:
  pronaos-qdrant:
  pronaos-grafana:
